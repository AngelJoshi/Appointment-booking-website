{% extends "base.html" %}
{% block title %}Admin Login — Adv. Ram S. Joshi{% endblock %}
{% block head %}
<style>
  .login-page{min-height:calc(100vh - 72px);display:flex;align-items:center;justify-content:center;padding:2rem 1.5rem}
  .login-wrap{width:100%;max-width:380px;animation:fadeUp 0.6s ease both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  .login-header{text-align:center;margin-bottom:2rem}
  .login-header .icon{font-size:2.2rem;display:block;margin-bottom:1rem;opacity:0.55}
  .login-header h1{font-family:var(--ff-serif);font-size:1.9rem;font-weight:300;color:var(--cream);margin-bottom:0.25rem}
  .login-header p{font-size:0.7rem;letter-spacing:0.1em;color:var(--muted)}
  .login-card{border:1px solid var(--border);padding:2.2rem;background:rgba(17,32,64,0.45);backdrop-filter:blur(8px)}
  label{display:block;font-size:0.58rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--gold);margin-bottom:0.45rem}
  input{width:100%;background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--cream);padding:0.8rem 1rem;font-family:var(--ff-sans);font-size:0.85rem;font-weight:300;outline:none;transition:border-color 0.25s,background 0.25s}
  input:focus{border-color:var(--gold);background:rgba(201,168,76,0.04)}
  input::placeholder{color:rgba(138,155,176,0.4)}
  .fg{margin-bottom:1.3rem}
  .login-btn{width:100%;padding:0.9rem;background:var(--gold);border:none;cursor:pointer;font-family:var(--ff-sans);font-size:0.74rem;font-weight:500;letter-spacing:0.18em;text-transform:uppercase;color:var(--navy);transition:all 0.25s}
  .login-btn:hover{background:var(--gold2);transform:translateY(-1px)}
  .login-footer{text-align:center;margin-top:1.2rem;font-size:0.65rem;color:var(--muted);line-height:1.6}
</style>
{% endblock %}

{% block content %}
<div class="login-page">
  <div class="login-wrap">
    <div class="login-header">
      <span class="icon">⚖</span>
      <h1>Admin Access</h1>
      <p>Authorised Personnel Only</p>
    </div>
    <div class="login-card">
      <form method="POST" action="/login">
        <div class="fg">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Enter username" required autocomplete="username"/>
        </div>
        <div class="fg">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter password" required autocomplete="current-password"/>
        </div>
        <button type="submit" class="login-btn">Access Dashboard</button>
      </form>
    </div>
    <p class="login-footer">Restricted to Adv. Ram S. Joshi and authorised staff only.</p>
  </div>
</div>
{% endblock %}
